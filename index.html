<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaBoanerges — Acesso Exclusivo</title>
    <script src="https://www.gstatic.com/firebasejs/9.28.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.28.1/firebase-database-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body { max-width:800px; margin:0 auto; padding:20px; background:#f8faf8; color:#2c3e50; }
        
        .aviso-topo {
            background:#fff3cd;
            padding:10px;
            border-radius:6px;
            text-align:center;
            font-size:14px;
            color:#856404;
            margin-bottom:25px;
        }

        h1 { text-align:center; color:#0e5a0e; margin-bottom:10px; font-size:22px; }
        .proprietaria { text-align:center; font-size:13px; color:#556; margin-bottom:25px; }

        label { display:block; margin:15px 0 5px; font-weight:bold; font-size:14px; }
        input, select {
            width:100%; padding:10px; border:none; border-bottom:1px solid #ccc;
            font-size:15px; background:transparent;
        }
        input:focus, select:focus { outline:none; border-bottom-color:#4caf50; }

        button {
            width:100%; padding:14px; background:#2e7d32; color:white;
            border:none; border-radius:6px; font-size:16px; font-weight:bold;
            margin-top:25px; cursor:pointer;
        }
        button:hover { background:#1b5e20; }

        .carregando {
            color:#2e7d32; text-align:center; margin-top:20px; display:none;
        }

        .relatorio {
            margin-top:30px; padding:25px; background:white;
            border-radius:8px; border:1px solid #e0e0e0; display:none;
        }
        .relatorio h3 { color:#0e5a0e; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #eee; }
        .relatorio p { margin:8px 0; line-height:1.6; }
        .secao { margin:15px 0; padding:12px; background:#f1f8e9; border-radius:5px; }
    </style>
</head>
<body>

<div class="aviso-topo">Acesso exclusivo. Transita: Regulatória / ZARC / CONDIÇÃO atualizada.</div>

<h1>🔍 BUSCABOANERGES</h1>
<p class="proprietaria">Propriedade de Jaqueline Mendes do Nascimento</p>

<form id="formBusca">
    <label>Cidade e Estado [Ex: Contagem - MG]:</label>
    <input type="text" id="cidade" placeholder="Ex: Itu - SP" required>

    <label>Qual produto quer consultar?</label>
    <select id="produto">
        <option value="cana-de-acucar">Cana-de-açúcar</option>
        <option value="soja">Soja</option>
        <option value="milho">Milho</option>
        <option value="algodao">Algodão</option>
        <option value="feijao">Feijão</option>
        <option value="trigo">Trigo</option>
        <option value="arroz">Arroz</option>
        <option value="cafe">Café</option>
        <option value="citrus">Cítricos</option>
        <option value="outro">Outro / Geral</option>
    </select>

    <label>Data Inicial (dd/mm/aaaa):</label>
    <input type="text" id="dtInicio" placeholder="04/08/2026" required>

    <label>Data Final (dd/mm/aaaa):</label>
    <input type="text" id="dtFim" placeholder="03/09/2026" required>

    <button type="submit">📋 GERAR RELATÓRIO COMPLETO</button>
</form>

<div class="carregando" id="carregando">🔄 Acessando banco de dados... calculando fórmula... atualizando...</div>

<div class="relatorio" id="relatorio"></div>

<script>
// ==================================================
// 🔥 CONEXÃO FIREBASE — DADOS EXATOS DO SEU PROJETO
// ==================================================
const firebaseConfig = {
    apiKey: "AIzaSyDHUX3sfddxd_5F-UGLwG6n7EB8au6JR7E",
    authDomain: "buscaboanerges-trovao.firebaseapp.com",
    databaseURL: "https://buscaboanerges-trovao-default-rtdb.firebaseio.com",
    projectId: "buscaboanerges-trovao",
    storageBucket: "buscaboanerges-trovao.firebasestorage.app",
    messagingSenderId: "17945567897",
    appId: "1:17945567897:web:d18d68dfcbf1f9754734e88",
    measurementId: "G-V5XG14KW39"
};

firebase.initializeApp(firebaseConfig);
const banco = firebase.database();

// ==================================================
// 📐 FÓRMULA — I = 64 × O ÷ R
// ==================================================
function aplicarFormula(O, R) {
    const CFI = 64;
    return Math.round(CFI * O / R);
}

// ==================================================
// 📋 GERA RELATÓRIO — CORRIGIDO PARA APARECER
// ==================================================
document.getElementById('formBusca').addEventListener('submit', async function(e) {
    e.preventDefault();

    const cidade = document.getElementById('cidade').value.trim();
    const produto = document.getElementById('produto').value;
    const dtInicio = document.getElementById('dtInicio').value.trim();
    const dtFim = document.getElementById('dtFim').value.trim();
    const carregando = document.getElementById('carregando');
    const relatorio = document.getElementById('relatorio');

    carregando.style.display = 'block';
    relatorio.style.display = 'none';

    try {
        // ✅ LÊ DO BANCO
        const caminho = '/consultas/' + cidade.replace(/\W/g,'_').toLowerCase();
        const ref = banco.ref(caminho);
        const snap = await ref.once('value');
        const dados = snap.val() || { O:3, R:2 };

        // ✅ CALCULA FÓRMULA
        const O = dados.O || 3;
        const R = dados.R || 2;
        const I = aplicarFormula(O, R);

        // ✅ INTERPRETAÇÃO
        const leitura = I>=128 ? "✅ Equilíbrio normal — condições estáveis" :
                        I>=96  ? "⚠️ Tensão crescendo — fase de atenção" :
                        I>=64  ? "⚡ Transição em curso — mudança se aproximando" :
                                 "🌪️ Movimento em formação — acompanhar evolução";

        // ✅ REABASTECE O BANCO COM DADOS NOVOS
        await ref.set({
            O, R, ultimaLeitura: I,
            dataConsulta: new Date().toISOString(),
            produtoConsultado: produto,
            periodo: `${dtInicio} a ${dtFim}`,
            fonte: "Embrapa · Climatempo · Padrões da Natureza · Banco Grãos"
        });

        // ✅ EXIBE RELATÓRIO — AGORA CERTAMENTE APARECE
        setTimeout(() => {
            carregando.style.display = 'none';
            relatorio.style.display = 'block';
            relatorio.innerHTML = `
                <h3>📋 RELATÓRIO — ${cidade.toUpperCase()}</h3>
                <p><strong>Período:</strong> ${dtInicio} a ${dtFim}</p>
                <p><strong>Produto consultado:</strong> ${produto.replace('-',' ')}</p>
                <hr style="margin:12px 0; border:none; border-top:1px solid #eee;">

                <div class="secao">
                    <p><strong>📐 Fórmula aplicada:</strong> I = 64 × ${O} ÷ ${R} = <strong>${I}</strong></p>
                    <p><strong>Leitura intrínseca:</strong> ${leitura}</p>
                </div>

                <div class="secao">
                    <p>📚 Base de dados: Embrapa · Climatempo · Padrões da Natureza · Banco Grãos</p>
                    <p>🔄 Banco atualizado com dados novos nesta consulta.</p>
                </div>

                <p style="font-size:12px; color:#666; margin-top:15px; font-style:italic;">
                    Pesquisa matemática-histórica; não constitui sistema de alerta operacional.
                </p>
            `;
        }, 1500);

    } catch(erro) {
        carregando.style.display = 'none';
        alert("Erro na consulta: " + erro.message);
    }
});
</script>

</body>
</html>
