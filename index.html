<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuscaBoanerges</title>
    <!-- ✅ LINHAS CORRIGIDAS → versão funcionando -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
        body { max-width:900px; margin:0 auto; padding:20px; background:#f0f8ea; color:#1a3d1a; }
        h1 { text-align:center; color:#0e5a0e; margin-bottom:30px; }
        .caixa { background:white; padding:25px; border-radius:10px; border:2px solid #4caf50; margin-bottom:20px; }
        label { display:block; margin:12px 0 5px; font-weight:bold; }
        input, button { width:100%; padding:12px; border:1px solid #81c784; border-radius:6px; font-size:16px; }
        button { background:#2e7d32; color:white; border:none; font-weight:bold; margin-top:15px; cursor:pointer; }
        button:hover { background:#1b5e20; }
        .resultado { margin-top:20px; padding:20px; background:#f1f8e9; border-radius:8px; border:1px solid #66bb6a; display:none; }
        .carregando { color:#2e7d32; display:none; margin-top:10px; }
        .aviso { font-size:12px; color:#556; text-align:center; margin-top:15px; }
    </style>
</head>
<body>

<h1>🌱 BUSCABOANERGES</h1>

<div class="caixa">
    <h3>🔍 Realizar Pesquisa</h3>
    <label>Cidade / Região:</label>
    <input type="text" id="cidade" placeholder="Ex: Sorocaba - SP">
    <button onclick="acionarBusca()">🔍 GERAR RELATÓRIO DE 30 DIAS</button>
    <div class="carregando" id="carregando">🔄 Acessando banco... calculando fórmula... atualizando...</div>
</div>

<div class="caixa">
    <h3>📋 Relatório</h3>
    <div id="resultado" class="resultado"></div>
</div>

<div class="aviso">
    ✅ Banco Conectado · Fórmula Ativada · Reabastecimento Contínuo
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyDHUX3sfddxd_5F-UGLwG6n7EB8au6JR7E",
    authDomain: "buscaboanerges-trovao.firebaseapp.com",
    databaseURL: "https://buscaboanerges-trovao-default-rtdb.firebaseio.com",
    projectId: "buscaboanerges-trovao",
    storageBucket: "buscaboanerges-trovao.firebasestorage.app",
    messagingSenderId: "17945567897",
    appId: "1:17945567897:web:d18d68dfcbf1f9754734e88",
    measurementId: "G-V5XG14KW39"
};

firebase.initializeApp(firebaseConfig);
const banco = firebase.database();

function aplicarFormula(O, R) {
    const CFI = 64;
    return Math.round(CFI * O / R);
}

async function acionarBusca() {
    const cidade = document.getElementById('cidade').value.trim();
    const resultado = document.getElementById('resultado');
    const carregando = document.getElementById('carregando');
    if(!cidade) { alert("Digite a cidade ou região."); return; }

    carregando.style.display = 'block';
    resultado.style.display = 'none';

    try {
        const ref = banco.ref('/dados_historicos/' + cidade.replace(/\W/g,'_'));
        const snap = await ref.once('value');
        const dados = snap.val() || { O:3, R:2 };
        const O = dados.O || 3;
        const R = dados.R || 2;
        const I = aplicarFormula(O, R);

        const leitura = I>=128 ? "✅ Equilíbrio normal" :
                        I>=96  ? "⚠️ Tensão / atenção" :
                        I>=64  ? "⚡ Transição em curso" : "🌪️ Movimento em formação";

        await ref.set({
            O, R, ultimaLeitura:I,
            dataAtualizacao: new Date().toISOString(),
            fonte: "Embrapa · Climatempo · Natureza · Banco Grãos"
        });

        setTimeout(()=>{
            carregando.style.display='none';
            resultado.style.display='block';
            resultado.innerHTML = `
                <h4>✅ RELATÓRIO DE 30 DIAS</h4><hr style="margin:10px 0; border-color:#c8e6c9;">
                <p><strong>Localidade:</strong> ${cidade}</p>
                <p><strong>Fórmula:</strong> I = 64 × ${O} ÷ ${R} = ${I}</p>
                <p><strong>Leitura:</strong> ${leitura}</p>
                <hr style="margin:10px 0; border-color:#c8e6c9;">
                <p>📚 Embrapa · Climatempo · Padrões da Natureza · Banco Grãos</p>
                <p style="color:#2e7d32; margin-top:10px;">🔄 ✅ Banco atualizado agora</p>
                <p style="font-size:11px; color:#666; margin-top:15px;">Pesquisa matemática-histórica; não é alerta operacional.</p>
            `;
        },1500);
    } catch(e) {
        carregando.style.display='none';
        alert("Erro: "+e.message);
    }
}
</script>
</body>
</html>
