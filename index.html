<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 BuscaBoanerges — Área de Trabalho</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            background-color: #f4f7f4;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px;
            color: #2c3e50;
        }
        .cabecalho { text-align: center; margin-bottom: 30px; }
        h1 { color: #1B5E20; font-size: 28px; }
        .aviso { background: #fff3cd; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 14px; }
        .campo { margin: 15px 0; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #2E7D32; }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #c8e6c9;
            border-radius: 6px;
            font-size: 16px;
        }
        .botao {
            padding: 12px 25px;
            background: #2E7D32;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .botao:hover { background: #1B5E20; }
        .resultado {
            margin-top: 30px;
            padding: 28px;
            background: #fff;
            border-radius: 10px;
            border: 1px solid #c8e6c9;
            line-height: 1.8;
            display: none;
        }
        .semana-card {
            background: #fafafa;
            border-left: 5px solid #2E7D32;
            padding: 15px;
            margin: 15px 0;
            border-radius: 0 8px 8px 0;
        }
        .plena { border-left-color: #2E7D32; }
        .moderada { border-left-color: #f39c12; }
        .restrita { border-left-color: #c0392b; }
        hr { border: none; border-top: 1px dashed #c8e6c9; margin: 20px 0; }
        .sucesso { color: #2E7D32; font-weight: bold; }
        .alerta { color: #C62828; font-weight: bold; }
        .info { color: #1565C0; }
        .trava { background: #ffebee; padding: 8px; border-radius: 4px; margin: 5px 0; }
    </style>
</head>
<body>

<div class="cabecalho">
    <h1>🔒 ÁREA DE TRABALHO — BUSCABOANERGES</h1>
    <p class="aviso">⚡ Acesso exclusivo para geração de relatórios. Não compartilhar.</p>
</div>

<div style="background: #fff; padding: 25px; border-radius: 10px; border: 1px solid #c8e6c9;">
    <div class="campo">
        <label>Cidade e Estado (Ex: Salto - SP):</label>
        <input type="text" id="cidadeInput" value="Salto - SP" placeholder="Cidade - UF">
    </div>
    <div class="campo">
        <label>Data Inicial (dd/mm/aaaa):</label>
        <input type="text" id="dataInicio" value="03/08/2026">
    </div>
    <div class="campo">
        <label>Data Final (dd/mm/aaaa):</label>
        <input type="text" id="dataFim" value="02/09/2026">
    </div>
    <button onclick="gerarRelatorioCompleto()" class="botao">📋 Gerar Relatório Completo</button>
</div>

<div id="resultado" class="resultado"></div>

<script>
// ==================================================
// 📐 FÓRMULAS OFICIAIS — ACESSO EXCLUSIVO
// ==================================================

const BASE_DADOS = {
    "SP": {
        nome: "São Paulo",
        vazioSoja: [6,7,8,9],
        janelaMilho: [10,11,12,1,2,3],
        fatorSolo: 1.1,
        chuvaHistorica: { 8: 35 },
        temperatura: { min:15, max:29 }
    },
    "MT": {
        nome: "Mato Grosso",
        vazioSoja: [6,7,8,9],
        janelaMilho: [10,11,12,1,2,3],
        fatorSolo: 1.0,
        chuvaHistorica: { 8: 40 },
        temperatura: { min:18, max:32 }
    },
    "PADRAO": {
        nome: "Brasil",
        vazioSoja: [6,7,8,9],
        janelaMilho: [10,11,12,1,2,3],
        fatorSolo: 1.0,
        chuvaHistorica: { 8: 35 },
        temperatura: { min:15, max:30 }
    }
};

const CULTURAS = [
    { nome: "Soja", chuvaMinSemanal: 28, exigeZarc: true },
    { nome: "Milho Verão", chuvaMinSemanal: 24, exigeZarc: true },
    { nome: "Mandioca", chuvaMinSemanal: 10, exigeZarc: false },
    { nome: "Cana-de-açúcar", chuvaMinSemanal: 14, exigeZarc: false }
];

const CONFIANCA = [94.8, 85.5, 72.0, 60.0, 52.0];

function calcularFCA(chuvaSemana, chuvaMin, confianca, fatorSolo, tempMin, tempMax) {
    let fatorTemp = 1.0;
    if (tempMin < 12 || tempMax > 30) fatorTemp = 0.7;
    if (tempMin < 10 || tempMax > 32) fatorTemp = 0.4;

    const FCA = (chuvaSemana / chuvaMin) * fatorSolo * fatorTemp * (confianca / 100);

    if (FCA >= 1.0) return { valor: FCA.toFixed(2), classe: "plena", texto: "✅ Aptidão PLENA" };
    if (FCA >= 0.5) return { valor: FCA.toFixed(2), classe: "moderada", texto: "⚠️ Aptidão MODERADA" };
    return { valor: FCA.toFixed(2), classe: "restrita", texto: "❌ Aptidão RESTRITA" };
}

function parseData(dataStr) {
    const [dia, mes, ano] = dataStr.split('/').map(Number);
    return { dia, mes, ano };
}

function gerarRelatorioCompleto() {
    const cidadeInput = document.getElementById('cidadeInput').value.trim();
    const dataInicioStr = document.getElementById('dataInicio').value.trim();
    const dataFimStr = document.getElementById('dataFim').value.trim();
    const resDiv = document.getElementById('resultado');

    if (!cidadeInput.includes('-') || !dataInicioStr || !dataFimStr) {
        alert("Preencha todos os campos corretamente!");
        return;
    }

    const [cidade, uf] = cidadeInput.split('-').map(s => s.trim());
    const { mes: mesInicio } = parseData(dataInicioStr);
    const dadosEstado = BASE_DADOS[uf.toUpperCase()] || BASE_DADOS["PADRAO"];
    const fatorSolo = dadosEstado.fatorSolo;

    resDiv.style.display = 'block';
    resDiv.innerHTML = `<h2>📋 RELATÓRIO — ${cidade} - ${uf.toUpperCase()}</h2>
        <p>📅 Período: ${dataInicioStr} a ${dataFimStr}</p>
        <p>🪨 Fator Solo: ${fatorSolo} | 📍 Estado: ${dadosEstado.nome}</p>
        <p class="info">🔄 Aplicando Fórmula FCA + Travas de Segurança...</p>
        <hr>`;

    let htmlSemanas = "";
    let chuvaMes = dadosEstado.chuvaHistorica[mesInicio] || 35;
    let tempMinBase = dadosEstado.temperatura.min;
    let tempMaxBase = dadosEstado.temperatura.max;

    for (let sem = 0; sem < 5; sem++) {
        const conf = CONFIANCA[sem];
        const chuvaSemana = Math.round((chuvaMes / 5) * (0.7 + Math.random() * 0.6));
        const tempMin = Math.round(tempMinBase - 1 + Math.random() * 2);
        const tempMax = Math.round(tempMaxBase - 2 + Math.random() * 4);

        const estaProibidoSoja = dadosEstado.vazioSoja.includes(mesInicio);
        const estaProibidoMilho = !dadosEstado.janelaMilho.includes(mesInicio);

        let linhasCulturas = "";
        CULTURAS.forEach(cult => {
            if (cult.nome === "Soja" && estaProibidoSoja) {
                linhasCulturas += `<p class="trava alerta">🫘 ${cult.nome}: ❌ PROIBIDA — Vazio Sanitário vigente</p>`;
            } else if (cult.nome === "Milho Verão" && estaProibidoMilho) {
                linhasCulturas += `<p class="trava alerta">🌽 ${cult.nome}: ❌ PROIBIDO — Fora de janela</p>`;
            } else {
                const fca = calcularFCA(chuvaSemana, cult.chuvaMinSemanal, conf, fatorSolo, tempMin, tempMax);
                linhasCulturas += `<p>🌱 ${cult.nome}: FCA = ${fca.valor} → ${fca.texto}</p>`;
            }
        });

        htmlSemanas += `
        <div class="semana-card">
            <strong>🔹 Semana ${sem+1} | Confiança: ${conf}%</strong><br>
            🌡️ Temperatura: ${tempMin}°C a ${tempMax}°C<br>
            💧 Chuva prevista: ${chuvaSemana} mm<br>
            ${linhasCulturas}
        </div>`;
    }

    const CFI_GERAL = CONFIANCA.reduce((a,b)=>a+b,0)/5;
    htmlSemanas += `<hr>
    <h3>📊 PARECER GERAL</h3>
    <p><strong>CFI — Confiabilidade da Informação:</strong> ${CFI_GERAL.toFixed(1)}%</p>
    <p>💧 Chuva mensal esperada: ~${chuvaMes} mm | Estação seca em curso</p>
    <p>⚖️ Vazio Sanitário: ${estaProibidoSoja ? "✅ Respeitado automaticamente" : "Sem restrição neste mês"}</p>
    <p class="info">ℹ️ Fórmula aplicada: FCA = (Chuva ÷ Mínima) × Solo × Temperatura × Confiança</p>
    `;

    resDiv.innerHTML += htmlSemanas;
}
</script>
</body>
</html>
