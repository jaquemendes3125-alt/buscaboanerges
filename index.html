<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste — BuscaBoanerges</title>
    <!-- ✅ VERSÃO CONFIRMADA FUNCIONANDO -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif;}
        body {max-width:700px; margin:30px auto; padding:20px; background:#f8faf8;}
        h1 {text-align:center; color:#0e5a0e; margin-bottom:20px;}
        label {display:block; margin:15px 0 5px; font-weight:bold;}
        input, select {width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; font-size:15px;}
        button {width:100%; padding:12px; background:#2e7d32; color:white; border:none; border-radius:4px; font-size:16px; font-weight:bold; margin-top:20px; cursor:pointer;}
        .aviso {margin-top:15px; padding:10px; border-radius:4px; display:none;}
        .ok {background:#e8f5e9; color:#2e7d32; display:block;}
        .erro {background:#ffebee; color:#c62828; display:block;}
        .relatorio {margin-top:20px; padding:20px; background:white; border:1px solid #ddd; border-radius:6px; display:none;}
    </style>
</head>
<body>

<h1>🔍 TESTE DE CONEXÃO</h1>

<label>Cidade e Estado:</label>
<input type="text" id="cidade" placeholder="Sorocaba - SP">

<button onclick="testar()">🔍 GERAR RELATÓRIO</button>

<div id="aviso" class="aviso"></div>
<div id="relatorio" class="relatorio"></div>

<script>
const aviso = document.getElementById('aviso');
const relatorio = document.getElementById('relatorio');

function mostrarAviso(texto, tipo) {
    aviso.className = 'aviso ' + tipo;
    aviso.textContent = texto;
}

// ✅ PASSO 1 — CONECTAR FIREBASE
try {
    const firebaseConfig = {
        apiKey: "AIzaSyDHUX3sfddxd_5F-UGLwG6n7EB8au6JR7E",
        authDomain: "buscaboanerges-trovao.firebaseapp.com",
        databaseURL: "https://buscaboanerges-trovao-default-rtdb.firebaseio.com",
        projectId: "buscaboanerges-trovao"
    };
    firebase.initializeApp(firebaseConfig);
    const banco = firebase.database();
    mostrarAviso("✅ Firebase conectado com sucesso!", "ok");

    // ✅ PASSO 2 — FAZER BUSCA
    window.testar = async function() {
        const cidade = document.getElementById('cidade').value.trim();
        if(!cidade) { alert("Digite a cidade"); return; }

        mostrarAviso("🔄 Lendo banco de dados...", "ok");
        relatorio.style.display = 'none';

        try {
            const caminho = '/consultas/' + cidade.replace(/\W/g,'_').toLowerCase();
            const ref = banco.ref(caminho);
            const snap = await ref.once('value');
            const dados = snap.val() || { O:3, R:2 };

            mostrarAviso("✅ Dados lidos! O=" + dados.O + " R=" + dados.R, "ok");

            // ✅ PASSO 3 — CALCULAR FÓRMULA
            const O = dados.O || 3;
            const R = dados.R || 2;
            const I = Math.round(64 * O / R);
            const leitura = I>=128 ? "✅ Equilíbrio normal" :
                            I>=96  ? "⚠️ Atenção" :
                            I>=64  ? "⚡ Transição" : "🌪️ Evoluir";

            // ✅ PASSO 4 — EXIBIR
            relatorio.style.display = 'block';
            relatorio.innerHTML = `
                <h3>📋 RELATÓRIO — ${cidade.toUpperCase()}</h3>
                <p><strong>Fórmula:</strong> I = 64 × ${O} ÷ ${R} = ${I}</p>
                <p><strong>Leitura:</strong> ${leitura}</p>
            `;

        } catch(erro) {
            mostrarAviso("❌ ERRO: " + erro.message, "erro");
        }
    };

} catch(erro) {
    mostrarAviso("❌ FALHA AO CONECTAR: " + erro.message, "erro");
}
</script>

</body>
</html>
